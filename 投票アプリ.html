<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学級旗コンテスト 投票システム</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .card-selected {
            border-color: #3b82f6 !important;
            background-color: #eff6ff !important;
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3) !important;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col antialiased">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i data-lucide="flag" class="w-6 h-6 text-yellow-300"></i>
                <h1 class="font-bold text-lg md:text-xl tracking-wide">学級旗コンテスト投票</h1>
            </div>
            <button id="nav-admin-btn" onclick="showAdminLogin()" class="text-xs bg-indigo-800 hover:bg-indigo-900 px-3 py-1.5 rounded text-indigo-100 flex items-center gap-1 transition">
                <i data-lucide="lock" class="w-3.5 h-3.5"></i>
                <span>管理画面</span>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6">

        <!-- ================= 画面1: 属性選択 (保護者 or 生徒) ================= -->
        <section id="step-voter-type" class="bg-white rounded-xl shadow-sm p-6 md:p-8 mb-6 border border-slate-200">
            <h2 class="text-xl font-bold text-center mb-6 text-slate-700 flex items-center justify-center gap-2">
                <i data-lucide="user-check" class="text-indigo-600"></i> 投票者を選択してください
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <button onclick="selectVoterType('guest')" class="p-6 border-2 border-slate-200 rounded-xl hover:border-indigo-500 hover:bg-indigo-50/50 transition flex flex-col items-center justify-center gap-3 group focus:outline-none">
                    <div class="w-16 h-16 rounded-full bg-slate-100 group-hover:bg-indigo-100 text-slate-600 group-hover:text-indigo-600 flex items-center justify-center transition">
                        <i data-lucide="users" class="w-8 h-8"></i>
                    </div>
                    <span class="text-lg font-bold text-slate-800">保護者・一般の皆様</span>
                    <span class="text-xs text-slate-500">学年・組の入力なしで直接投票できます</span>
                </button>
                
                <button onclick="selectVoterType('student')" class="p-6 border-2 border-slate-200 rounded-xl hover:border-indigo-500 hover:bg-indigo-50/50 transition flex flex-col items-center justify-center gap-3 group focus:outline-none">
                    <div class="w-16 h-16 rounded-full bg-slate-100 group-hover:bg-indigo-100 text-slate-600 group-hover:text-indigo-600 flex items-center justify-center transition">
                        <i data-lucide="graduation-cap" class="w-8 h-8"></i>
                    </div>
                    <span class="text-lg font-bold text-slate-800">生徒の皆さん</span>
                    <span class="text-xs text-slate-500">学年・組・出席番号を入力して投票します</span>
                </button>
            </div>
        </section>

        <!-- ================= 画面2: 生徒情報入力 (生徒選択時のみ表示) ================= -->
        <section id="step-student-info" class="hidden bg-white rounded-xl shadow-sm p-6 md:p-8 mb-6 border border-slate-200">
            <div class="flex items-center justify-between mb-4 pb-2 border-b">
                <h2 class="text-lg font-bold text-slate-700 flex items-center gap-2">
                    <i data-lucide="id-card" class="text-indigo-600"></i> 生徒情報の入力
                </h2>
                <button onclick="resetToVoterType()" class="text-xs text-indigo-600 hover:underline flex items-center gap-1">
                    <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> 戻る
                </button>
            </div>

            <div class="space-y-6">
                <!-- 学年選択 -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">学年</label>
                    <div class="grid grid-cols-3 gap-3">
                        <button type="button" onclick="setStudentGrade(1)" class="btn-grade border-2 border-slate-200 py-3 rounded-lg text-center font-bold text-slate-700 hover:border-indigo-400">1年生</button>
                        <button type="button" onclick="setStudentGrade(2)" class="btn-grade border-2 border-slate-200 py-3 rounded-lg text-center font-bold text-slate-700 hover:border-indigo-400">2年生</button>
                        <button type="button" onclick="setStudentGrade(3)" class="btn-grade border-2 border-slate-200 py-3 rounded-lg text-center font-bold text-slate-700 hover:border-indigo-400">3年生</button>
                    </div>
                </div>

                <!-- クラス選択 (1〜6組) -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">組</label>
                    <div class="grid grid-cols-5 gap-2">
                        <button type="button" onclick="setStudentClass(1)" class="btn-class border-2 border-slate-200 py-2.5 rounded-lg text-center font-bold text-slate-700 hover:border-indigo-400">1組</button>
                        <button type="button" onclick="setStudentClass(2)" class="btn-class border-2 border-slate-200 py-2.5 rounded-lg text-center font-bold text-slate-700 hover:border-indigo-400">2組</button>
                        <button type="button" onclick="setStudentClass(3)" class="btn-class border-2 border-slate-200 py-2.5 rounded-lg text-center font-bold text-slate-700 hover:border-indigo-400">3組</button>
                        <button type="button" onclick="setStudentClass(5)" class="btn-class border-2 border-slate-200 py-2.5 rounded-lg text-center font-bold text-slate-700 hover:border-indigo-400">5組</button>
                        <button type="button" onclick="setStudentClass(6)" class="btn-class border-2 border-slate-200 py-2.5 rounded-lg text-center font-bold text-slate-700 hover:border-indigo-400">6組</button>
                    </div>
                </div>

                <!-- 出席番号選択 -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">出席番号</label>
                    <select id="student-number" onchange="setStudentNumber(this.value)" class="w-full border-2 border-slate-200 rounded-lg p-3 bg-white font-bold text-slate-700 focus:border-indigo-500 focus:outline-none">
                        <option value="">選択してください</option>
                    </select>
                </div>

                <!-- 次へボタン -->
                <button id="btn-to-vote" disabled onclick="proceedToVote()" class="w-full bg-slate-300 text-white font-bold py-3.5 rounded-lg transition duration-200 flex items-center justify-center gap-2 cursor-not-allowed">
                    作品一覧へ進む <i data-lucide="arrow-right" class="w-5 h-5"></i>
                </button>
            </div>
        </section>

        <!-- ================= 画面3: 作品選択 (学級旗カード一覧) ================= -->
        <section id="step-vote-cards" class="hidden">
            <div class="bg-white rounded-xl shadow-sm p-4 mb-6 border border-slate-200 flex flex-wrap justify-between items-center gap-3">
                <div class="flex items-center gap-2">
                    <span id="voter-badge" class="bg-indigo-100 text-indigo-800 font-bold px-3 py-1 rounded-full text-xs">生徒</span>
                    <span id="voter-info-display" class="font-bold text-slate-700 text-sm"></span>
                </div>
                <button onclick="resetToVoterType()" class="text-xs text-slate-500 hover:text-slate-800 underline flex items-center gap-1">
                    最初からやり直す
                </button>
            </div>

            <!-- 学年フィルタータブ -->
            <div class="flex border-b border-slate-200 mb-6 bg-white rounded-t-xl overflow-hidden shadow-sm">
                <button onclick="filterGrade('all')" class="tab-btn flex-1 py-3 text-center font-bold text-sm border-b-2 border-indigo-600 text-indigo-600 bg-indigo-50/30">すべて (8作品)</button>
                <button onclick="filterGrade('1')" class="tab-btn flex-1 py-3 text-center font-bold text-sm text-slate-500 border-b-2 border-transparent hover:text-slate-800">1年生</button>
                <button onclick="filterGrade('2')" class="tab-btn flex-1 py-3 text-center font-bold text-sm text-slate-500 border-b-2 border-transparent hover:text-slate-800">2年生</button>
                <button onclick="filterGrade('3')" class="tab-btn flex-1 py-3 text-center font-bold text-sm text-slate-500 border-b-2 border-transparent hover:text-slate-800">3年生</button>
            </div>

            <!-- カード一覧コンテナ -->
            <div id="flag-cards-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <!-- JSで動的生成 -->
            </div>

            <!-- 投票確定浮き出しボタン -->
            <div class="sticky bottom-4 z-30">
                <button id="btn-submit-vote" disabled onclick="confirmVoteModal()" class="w-full bg-slate-300 text-slate-500 font-bold py-4 rounded-xl shadow-lg text-lg flex items-center justify-center gap-2 cursor-not-allowed transition-all">
                    <i data-lucide="check-circle" class="w-6 h-6"></i>
                    <span>学級旗を選択してください</span>
                </button>
            </div>
        </section>

        <!-- ================= 管理画面 ================= -->
        <section id="section-admin" class="hidden space-y-6">
            <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-200 flex justify-between items-center">
                <div>
                    <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                        <i data-lucide="bar-chart-3" class="text-indigo-600"></i> 管理者ダッシュボード
                    </h2>
                    <p class="text-xs text-slate-500 mt-1">リアルタイム集計結果とCSVダウンロード</p>
                </div>
                <button onclick="closeAdmin()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-1">
                    <i data-lucide="x" class="w-4 h-4"></i> 閉じる
                </button>
            </div>

            <!-- 管理画面タブ -->
            <div class="flex border-b border-slate-200 bg-white rounded-t-xl overflow-hidden">
                <button onclick="switchAdminTab('results')" id="admin-tab-results" class="flex-1 py-3 font-bold text-sm text-indigo-600 border-b-2 border-indigo-600 bg-indigo-50/50">集計結果</button>
                <button onclick="switchAdminTab('settings')" id="admin-tab-settings" class="flex-1 py-3 font-bold text-sm text-slate-500 border-b-2 border-transparent">学級旗設定 (タイトル・画像)</button>
            </div>

            <!-- タブ1: 集計結果 -->
            <div id="admin-content-results" class="space-y-6">
                <div class="grid grid-cols-3 gap-4">
                    <div class="bg-white p-4 rounded-xl border border-slate-200 text-center">
                        <span class="text-xs text-slate-500 font-bold block mb-1">総投票数</span>
                        <span id="stat-total" class="text-2xl md:text-3xl font-extrabold text-slate-800">0</span>
                    </div>
                    <div class="bg-indigo-50 p-4 rounded-xl border border-indigo-100 text-center">
                        <span class="text-xs text-indigo-600 font-bold block mb-1">生徒票</span>
                        <span id="stat-student" class="text-2xl md:text-3xl font-extrabold text-indigo-700">0</span>
                    </div>
                    <div class="bg-sky-50 p-4 rounded-xl border border-sky-100 text-center">
                        <span class="text-xs text-sky-600 font-bold block mb-1">保護者票</span>
                        <span id="stat-guest" class="text-2xl md:text-3xl font-extrabold text-sky-700">0</span>
                    </div>
                </div>

                <!-- 各クラス得票一覧 -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                    <h3 class="font-bold text-slate-700 mb-4 pb-2 border-b flex justify-between items-center">
                        <span>クラス別集計結果</span>
                        <span class="text-xs font-normal text-slate-500">青: 生徒 / 空色: 保護者</span>
                    </h3>
                    <div id="admin-results-list" class="space-y-4">
                        <!-- JSで動的生成 -->
                    </div>
                </div>

                <!-- エクスポート＆データ操作 -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-4">
                    <h3 class="font-bold text-slate-700 pb-2 border-b">データ操作・出力</h3>
                    <div class="flex flex-wrap gap-3">
                        <button onclick="downloadResultsCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2.5 rounded-lg text-sm flex items-center gap-2 shadow-sm transition">
                            <i data-lucide="download" class="w-4 h-4"></i> 集計CSVを出力 (Excel文字化け防止加工済)
                        </button>
                        <button onclick="downloadHistoryCSV()" class="bg-slate-700 hover:bg-slate-800 text-white font-bold px-4 py-2.5 rounded-lg text-sm flex items-center gap-2 shadow-sm transition">
                            <i data-lucide="file-text" class="w-4 h-4"></i> 投票明細CSVを出力
                        </button>
                    </div>
                    <div class="pt-4 border-t">
                        <button onclick="resetAllVotes()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 font-bold px-4 py-2 rounded-lg text-xs flex items-center gap-1 transition">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> 全投票データを消去 (リセット)
                        </button>
                    </div>
                </div>
            </div>

            <!-- タブ2: 学級旗設定 (タイトル・画像変更) -->
            <div id="admin-content-settings" class="hidden space-y-4">
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                    <h3 class="font-bold text-slate-700 mb-2">各学級旗の情報編集</h3>
                    <p class="text-xs text-slate-500 mb-6">クラスタイトルや画像ファイルを変更できます。変更内容は即座に投票画面へ反映されます。</p>

                    <div id="admin-settings-list" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- JSで動的生成 -->
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-200 border-t border-slate-300 py-4 text-center text-xs text-slate-500">
        文化祭 学級旗コンテスト 投票システム
    </footer>

    <!-- ================= モーダル類 ================= -->

    <!-- モーダル1: 投票確認ダイアログ -->
    <div id="modal-confirm" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl animate-fade-in space-y-4">
            <h3 class="text-lg font-bold text-slate-800 text-center border-b pb-3">投票内容の確認</h3>
            
            <div class="text-center space-y-3">
                <div id="confirm-voter-tag" class="inline-block bg-indigo-100 text-indigo-800 text-xs font-bold px-3 py-1 rounded-full"></div>
                <div id="confirm-flag-title" class="text-2xl font-black text-indigo-600"></div>
                
                <div class="rounded-lg overflow-hidden border border-slate-200 max-h-48 flex items-center justify-center bg-slate-50">
                    <img id="confirm-flag-img" src="" alt="" class="object-contain max-h-48 w-full">
                </div>
            </div>

            <p class="text-center text-xs text-rose-500 font-bold">※投票は一度送信するとやり直せません。</p>

            <div class="grid grid-cols-2 gap-3 pt-2">
                <button onclick="closeConfirmModal()" class="py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition">やり直す</button>
                <button onclick="submitVote()" class="py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition">確定して投票</button>
            </div>
        </div>
    </div>

    <!-- モーダル2: 投票完了画面 -->
    <div id="modal-complete" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-8 shadow-2xl text-center space-y-4">
            <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto">
                <i data-lucide="check" class="w-10 h-10"></i>
            </div>
            <h3 class="text-2xl font-black text-slate-800">投票が完了しました</h3>
            <p class="text-sm text-slate-600">ご協力ありがとうございました。<br>結果発表をお楽しみに！</p>
            <div class="pt-4">
                <button onclick="finishVoteAndReset()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow transition">
                    トップ画面へ戻る
                </button>
            </div>
        </div>
    </div>

    <!-- モーダル3: 管理者ログイン -->
    <div id="modal-admin-login" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-xs w-full p-6 shadow-2xl space-y-4">
            <h3 class="text-lg font-bold text-slate-800 text-center">管理者ログイン</h3>
            <div>
                <input type="password" id="admin-pass-input" placeholder="パスワードを入力" class="w-full border border-slate-300 rounded-lg p-3 text-center text-lg focus:outline-none focus:border-indigo-500">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="closeAdminLogin()" class="py-2.5 bg-slate-100 text-slate-700 font-bold rounded-lg text-sm">キャンセル</button>
                <button onclick="verifyAdminPass()" class="py-2.5 bg-indigo-600 text-white font-bold rounded-lg text-sm">ログイン</button>
            </div>
        </div>
    </div>

    <!-- JavaScript ロジック -->
    <script>
        // Default Flag Data (全8クラス)
        const DEFAULT_FLAGS = [
            { id: '1-1', grade: 1, name: '1年1組', imageUrl: 'https://images.unsplash.com/photo-1541701494587-cb58502866ab?auto=format&fit=crop&w=600&q=80' },
            { id: '1-2', grade: 1, name: '1年2組', imageUrl: 'https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?auto=format&fit=crop&w=600&q=80' },
            { id: '1-3', grade: 1, name: '1年3組', imageUrl: 'https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=600&q=80' },
            { id: '2-1', grade: 2, name: '2年1組', imageUrl: 'https://images.unsplash.com/photo-1513364776144-60967b0f800f?auto=format&fit=crop&w=600&q=80' },
            { id: '2-2', grade: 2, name: '2年2組', imageUrl: 'https://images.unsplash.com/photo-1508898578281-774ac4893c0c?auto=format&fit=crop&w=600&q=80' },
            { id: '3-1', grade: 3, name: '3年1組', imageUrl: 'https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?auto=format&fit=crop&w=600&q=80' },
            { id: '3-2', grade: 3, name: '3年2組', imageUrl: 'https://images.unsplash.com/photo-1563089145-599997674d42?auto=format&fit=crop&w=600&q=80' },
            { id: '3-3', grade: 3, name: '3年3組', imageUrl: 'https://images.unsplash.com/photo-1550684848-fac1c5b4e853?auto=format&fit=crop&w=600&q=80' },
        ];

        // State Management
        let flags = [];
        let state = {
            voterType: null, // 'student' | 'guest'
            studentGrade: null,
            studentClass: null,
            studentNumber: null,
            selectedFlagId: null,
            filterGrade: 'all'
        };

        // Storage Keys
        const STORAGE_FLAGS = 'flag_app_data_v2';
        const STORAGE_VOTES = 'flag_votes_v2';
        const STORAGE_VOTED_STUDENTS = 'flag_voted_students_v2';

        // Admin Auth
        const ADMIN_PASS = 'admin123';

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            init出席番号Select();
            loadFlagsData();
            renderCards();
            lucide.createIcons();
        });

        // Populate Student Number Options (1〜40)
        function init出席番号Select() {
            const sel = document.getElementById('student-number');
            sel.innerHTML = '<option value="">選択してください</option>';
            for (let i = 1; i <= 40; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `${i}番`;
                sel.appendChild(opt);
            }
        }

        // Load Flag Config from LocalStorage
        function loadFlagsData() {
            const saved = localStorage.getItem(STORAGE_FLAGS);
            if (saved) {
                try {
                    flags = JSON.parse(saved);
                } catch(e) {
                    flags = [...DEFAULT_FLAGS];
                }
            } else {
                flags = [...DEFAULT_FLAGS];
            }
        }

        function saveFlagsData() {
            localStorage.setItem(STORAGE_FLAGS, JSON.stringify(flags));
        }

        // --- Step Navigation & State Control ---

        function selectVoterType(type) {
            state.voterType = type;
            document.getElementById('step-voter-type').classList.add('hidden');

            if (type === 'guest') {
                document.getElementById('voter-badge').className = "bg-sky-100 text-sky-800 font-bold px-3 py-1 rounded-full text-xs";
                document.getElementById('voter-badge').textContent = "保護者・一般";
                document.getElementById('voter-info-display').textContent = "保護者投票";
                document.getElementById('step-vote-cards').classList.remove('hidden');
            } else {
                document.getElementById('step-student-info').classList.remove('hidden');
            }
            lucide.createIcons();
        }

        function resetToVoterType() {
            state = { voterType: null, studentGrade: null, studentClass: null, studentNumber: null, selectedFlagId: null, filterGrade: 'all' };
            
            // Reset UI States
            document.querySelectorAll('.btn-grade, .btn-class').forEach(b => b.classList.remove('border-indigo-600', 'bg-indigo-50', 'text-indigo-600'));
            document.getElementById('student-number').value = '';
            document.getElementById('btn-to-vote').disabled = true;
            document.getElementById('btn-to-vote').className = "w-full bg-slate-300 text-white font-bold py-3.5 rounded-lg transition duration-200 flex items-center justify-center gap-2 cursor-not-allowed";

            document.getElementById('step-voter-type').classList.remove('hidden');
            document.getElementById('step-student-info').classList.add('hidden');
            document.getElementById('step-vote-cards').classList.add('hidden');
            document.getElementById('section-admin').classList.add('hidden');
            renderCards();
        }

        function setStudentGrade(g) {
            state.studentGrade = g;
            document.querySelectorAll('.btn-grade').forEach((btn, idx) => {
                if ([1,2,3][idx] === g) {
                    btn.classList.add('border-indigo-600', 'bg-indigo-50', 'text-indigo-600');
                } else {
                    btn.classList.remove('border-indigo-600', 'bg-indigo-50', 'text-indigo-600');
                }
            });
            validateStudentStep();
        }

        function setStudentClass(c) {
            state.studentClass = c;
            const classArr = [1, 2, 3, 5, 6];
            document.querySelectorAll('.btn-class').forEach((btn, idx) => {
                if (classArr[idx] === c) {
                    btn.classList.add('border-indigo-600', 'bg-indigo-50', 'text-indigo-600');
                } else {
                    btn.classList.remove('border-indigo-600', 'bg-indigo-50', 'text-indigo-600');
                }
            });
            validateStudentStep();
        }

        function setStudentNumber(num) {
            state.studentNumber = num ? parseInt(num) : null;
            validateStudentStep();
        }

        function validateStudentStep() {
            const btn = document.getElementById('btn-to-vote');
            if (state.studentGrade && state.studentClass && state.studentNumber) {
                btn.disabled = false;
                btn.className = "w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-lg shadow-md transition duration-200 flex items-center justify-center gap-2 cursor-pointer";
            } else {
                btn.disabled = true;
                btn.className = "w-full bg-slate-300 text-white font-bold py-3.5 rounded-lg transition duration-200 flex items-center justify-center gap-2 cursor-not-allowed";
            }
        }

        function proceedToVote() {
            // 重複投票チェック (生徒キー: G-C-N)
            const studentKey = `${state.studentGrade}-${state.studentClass}-${state.studentNumber}`;
            const votedStudents = JSON.parse(localStorage.getItem(STORAGE_VOTED_STUDENTS) || '[]');

            if (votedStudents.includes(studentKey)) {
                alert(`すでに ${state.studentGrade}年${state.studentClass}組${state.studentNumber}番 の投票データが存在します。\n生徒による投票は1回限りです。`);
                return;
            }

            document.getElementById('voter-badge').className = "bg-indigo-100 text-indigo-800 font-bold px-3 py-1 rounded-full text-xs";
            document.getElementById('voter-badge').textContent = "生徒";
            document.getElementById('voter-info-display').textContent = `${state.studentGrade}年 ${state.studentClass}組 ${state.studentNumber}番`;

            document.getElementById('step-student-info').classList.add('hidden');
            document.getElementById('step-vote-cards').classList.remove('hidden');
            renderCards();
            lucide.createIcons();
        }

        // --- Cards & Selection ---

        function filterGrade(grade) {
            state.filterGrade = grade;
            document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
                const keys = ['all', '1', '2', '3'];
                if (keys[idx] === grade) {
                    btn.className = "tab-btn flex-1 py-3 text-center font-bold text-sm border-b-2 border-indigo-600 text-indigo-600 bg-indigo-50/30";
                } else {
                    btn.className = "tab-btn flex-1 py-3 text-center font-bold text-sm text-slate-500 border-b-2 border-transparent hover:text-slate-800";
                }
            });
            renderCards();
        }

        function renderCards() {
            const grid = document.getElementById('flag-cards-grid');
            grid.innerHTML = '';

            const filtered = flags.filter(f => state.filterGrade === 'all' || f.grade == state.filterGrade);

            filtered.forEach(flag => {
                const isSelected = state.selectedFlagId === flag.id;
                
                const card = document.createElement('div');
                card.className = `bg-white rounded-xl overflow-hidden border-2 cursor-pointer transition-all duration-200 flex flex-col justify-between ${isSelected ? 'card-selected border-indigo-600' : 'border-slate-200 hover:border-slate-300'}`;
                card.onclick = () => selectCard(flag.id);

                card.innerHTML = `
                    <div>
                        <div class="relative aspect-video bg-slate-100 overflow-hidden">
                            <img src="${flag.imageUrl}" alt="${flag.name}" class="w-full h-full object-cover">
                            ${isSelected ? '<div class="absolute top-2 right-2 bg-indigo-600 text-white p-1.5 rounded-full shadow"><i data-lucide="check" class="w-5 h-5"></i></div>' : ''}
                        </div>
                        <div class="p-4">
                            <h3 class="text-xl font-bold text-slate-800">${flag.name}</h3>
                        </div>
                    </div>
                    <div class="px-4 pb-4">
                        <div class="w-full py-2.5 rounded-lg text-center font-bold text-sm transition ${isSelected ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'}">
                            ${isSelected ? '選択中' : 'この学級旗を選ぶ'}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        function selectCard(id) {
            state.selectedFlagId = id;
            renderCards();

            const submitBtn = document.getElementById('btn-submit-vote');
            const targetFlag = flags.find(f => f.id === id);
            
            submitBtn.disabled = false;
            submitBtn.className = "w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg text-lg flex items-center justify-center gap-2 cursor-pointer transition-all";
            submitBtn.innerHTML = `<i data-lucide="check-circle" class="w-6 h-6"></i> <span>「${targetFlag.name}」に投票する</span>`;
            lucide.createIcons();
        }

        // --- Confirmation & Voting Submission ---

        function confirmVoteModal() {
            if (!state.selectedFlagId) return;

            const flag = flags.find(f => f.id === state.selectedFlagId);
            
            document.getElementById('confirm-voter-tag').textContent = state.voterType === 'guest' ? '保護者・一般投票' : `生徒: ${state.studentGrade}年${state.studentClass}組${state.studentNumber}番`;
            document.getElementById('confirm-flag-title').textContent = flag.name;
            document.getElementById('confirm-flag-img').src = flag.imageUrl;

            document.getElementById('modal-confirm').classList.remove('hidden');
            lucide.createIcons();
        }

        function closeConfirmModal() {
            document.getElementById('modal-confirm').classList.add('hidden');
        }

        function submitVote() {
            const flag = flags.find(f => f.id === state.selectedFlagId);
            
            const voteRecord = {
                id: Date.now(),
                timestamp: new Date().toLocaleString('ja-JP'),
                voterType: state.voterType,
                studentInfo: state.voterType === 'student' ? {
                    grade: state.studentGrade,
                    class: state.studentClass,
                    number: state.studentNumber
                } : null,
                flagId: flag.id,
                flagName: flag.name
            };

            // Save Vote to Storage
            const votes = JSON.parse(localStorage.getItem(STORAGE_VOTES) || '[]');
            votes.push(voteRecord);
            localStorage.setItem(STORAGE_VOTES, JSON.stringify(votes));

            // If Student, record voted key to prevent re-vote
            if (state.voterType === 'student') {
                const studentKey = `${state.studentGrade}-${state.studentClass}-${state.studentNumber}`;
                const votedStudents = JSON.parse(localStorage.getItem(STORAGE_VOTED_STUDENTS) || '[]');
                votedStudents.push(studentKey);
                localStorage.setItem(STORAGE_VOTED_STUDENTS, JSON.stringify(votedStudents));
            }

            closeConfirmModal();
            document.getElementById('modal-complete').classList.remove('hidden');
            lucide.createIcons();
        }

        function finishVoteAndReset() {
            document.getElementById('modal-complete').classList.add('hidden');
            resetToVoterType();
        }

        // --- Admin Functions ---

        function showAdminLogin() {
            document.getElementById('admin-pass-input').value = '';
            document.getElementById('modal-admin-login').classList.remove('hidden');
        }

        function closeAdminLogin() {
            document.getElementById('modal-admin-login').classList.add('hidden');
        }

        function verifyAdminPass() {
            const pass = document.getElementById('admin-pass-input').value;
            if (pass === ADMIN_PASS) {
                closeAdminLogin();
                openAdminPanel();
            } else {
                alert('パスワードが正しくありません');
            }
        }

        function openAdminPanel() {
            document.getElementById('step-voter-type').classList.add('hidden');
            document.getElementById('step-student-info').classList.add('hidden');
            document.getElementById('step-vote-cards').classList.add('hidden');
            document.getElementById('section-admin').classList.remove('hidden');

            renderAdminResults();
            renderAdminSettings();
            lucide.createIcons();
        }

        function closeAdmin() {
            document.getElementById('section-admin').classList.add('hidden');
            resetToVoterType();
        }

        function switchAdminTab(tab) {
            const resTab = document.getElementById('admin-tab-results');
            const setTab = document.getElementById('admin-tab-settings');
            const resContent = document.getElementById('admin-content-results');
            const setContent = document.getElementById('admin-content-settings');

            if (tab === 'results') {
                resTab.className = "flex-1 py-3 font-bold text-sm text-indigo-600 border-b-2 border-indigo-600 bg-indigo-50/50";
                setTab.className = "flex-1 py-3 font-bold text-sm text-slate-500 border-b-2 border-transparent";
                resContent.classList.remove('hidden');
                setContent.classList.add('hidden');
                renderAdminResults();
            } else {
                setTab.className = "flex-1 py-3 font-bold text-sm text-indigo-600 border-b-2 border-indigo-600 bg-indigo-50/50";
                resTab.className = "flex-1 py-3 font-bold text-sm text-slate-500 border-b-2 border-transparent";
                setContent.classList.remove('hidden');
                resContent.classList.add('hidden');
                renderAdminSettings();
            }
        }

        function renderAdminResults() {
            const votes = JSON.parse(localStorage.getItem(STORAGE_VOTES) || '[]');
            
            // Calc stats
            const total = votes.length;
            const studentVotes = votes.filter(v => v.voterType === 'student').length;
            const guestVotes = votes.filter(v => v.voterType === 'guest').length;

            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-student').textContent = studentVotes;
            document.getElementById('stat-guest').textContent = guestVotes;

            // Group by flag
            const counts = {};
            flags.forEach(f => {
                counts[f.id] = { total: 0, student: 0, guest: 0, flag: f };
            });

            votes.forEach(v => {
                if (counts[v.flagId]) {
                    counts[v.flagId].total++;
                    if (v.voterType === 'student') counts[v.flagId].student++;
                    if (v.voterType === 'guest') counts[v.flagId].guest++;
                }
            });

            const listContainer = document.getElementById('admin-results-list');
            listContainer.innerHTML = '';

            const sortedFlags = Object.values(counts).sort((a,b) => b.total - a.total);

            sortedFlags.forEach(item => {
                const maxVote = Math.max(...sortedFlags.map(s => s.total), 1);
                const pctStudent = (item.student / maxVote) * 100;
                const pctGuest = (item.guest / maxVote) * 100;

                const row = document.createElement('div');
                row.className = "space-y-1.5";
                row.innerHTML = `
                    <div class="flex justify-between items-center text-sm font-bold">
                        <span class="text-slate-800">${item.flag.name}</span>
                        <div class="space-x-2 text-xs">
                            <span class="text-indigo-600">生徒: ${item.student}</span>
                            <span class="text-sky-600">保護者: ${item.guest}</span>
                            <span class="text-slate-800 font-extrabold text-sm ml-1">計: ${item.total}票</span>
                        </div>
                    </div>
                    <div class="h-4 bg-slate-100 rounded-full overflow-hidden flex">
                        <div style="width: ${pctStudent}%" class="bg-indigo-600 h-full"></div>
                        <div style="width: ${pctGuest}%" class="bg-sky-400 h-full"></div>
                    </div>
                `;
                listContainer.appendChild(row);
            });
        }

        function renderAdminSettings() {
            const container = document.getElementById('admin-settings-list');
            container.innerHTML = '';

            flags.forEach((flag, index) => {
                const item = document.createElement('div');
                item.className = "border rounded-xl p-4 space-y-3 bg-slate-50";
                item.innerHTML = `
                    <div class="font-bold text-slate-700 border-b pb-2 flex justify-between items-center">
                        <span>${flag.name} の設定</span>
                        <span class="text-xs text-slate-400">ID: ${flag.id}</span>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">作品タイトル・クラス名</label>
                        <input type="text" id="setting-name-${flag.id}" value="${flag.name}" class="w-full text-sm border rounded p-2 font-bold">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">学級旗の画像</label>
                        <div class="flex gap-3 items-center">
                            <img id="preview-${flag.id}" src="${flag.imageUrl}" class="w-20 h-14 object-cover rounded border bg-white">
                            <div class="flex-1 space-y-1">
                                <input type="file" accept="image/*" onchange="handleImageUpload(event, '${flag.id}')" class="text-xs w-full text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-bold file:bg-indigo-50 file:text-indigo-700">
                                <button onclick="resetSingleImage('${flag.id}')" class="text-xs text-slate-400 hover:underline">デフォルト画像に戻す</button>
                            </div>
                        </div>
                    </div>

                    <div class="pt-2">
                        <button onclick="saveSingleSetting('${flag.id}')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded text-xs transition">
                            設定を保存
                        </button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function handleImageUpload(e, id) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const base64Img = evt.target.result;
                document.getElementById(`preview-${id}`).src = base64Img;
                // update state
                const flag = flags.find(f => f.id === id);
                if (flag) flag.imageUrl = base64Img;
            };
            reader.readAsDataURL(file);
        }

        function saveSingleSetting(id) {
            const flag = flags.find(f => f.id === id);
            if (!flag) return;

            const newName = document.getElementById(`setting-name-${id}`).value;

            flag.name = newName;

            saveFlagsData();
            alert(`${flag.name} の設定を更新しました。`);
            renderCards();
        }

        function resetSingleImage(id) {
            const defaultFlag = DEFAULT_FLAGS.find(f => f.id === id);
            const flag = flags.find(f => f.id === id);
            if (defaultFlag && flag) {
                flag.imageUrl = defaultFlag.imageUrl;
                document.getElementById(`preview-${id}`).src = defaultFlag.imageUrl;
                saveFlagsData();
                alert('画像を初期状態に戻しました。');
                renderCards();
            }
        }

        // --- CSV Export Functions (BOM Header to prevent Excel Encoding Issue) ---

        function downloadResultsCSV() {
            const votes = JSON.parse(localStorage.getItem(STORAGE_VOTES) || '[]');
            
            // Build aggregated rows
            let csvContent = "\uFEFFクラス名,生徒票,保護者票,合計得票数\n";

            flags.forEach(f => {
                const studentCount = votes.filter(v => v.flagId === f.id && v.voterType === 'student').length;
                const guestCount = votes.filter(v => v.flagId === f.id && v.voterType === 'guest').length;
                const total = studentCount + guestCount;

                csvContent += `"${f.name}",${studentCount},${guestCount},${total}\n`;
            });

            downloadCSVFile(csvContent, `学級旗コンテスト_集計結果_${formatDateForFile()}.csv`);
        }

        function downloadHistoryCSV() {
            const votes = JSON.parse(localStorage.getItem(STORAGE_VOTES) || '[]');
            
            let csvContent = "\uFEFF日時,区分,学年,組,出席番号,投票先クラス\n";

            votes.forEach(v => {
                const dateStr = v.timestamp;
                const typeStr = v.voterType === 'student' ? '生徒' : '保護者';
                const grade = v.studentInfo ? `${v.studentInfo.grade}年` : '-';
                const cls = v.studentInfo ? `${v.studentInfo.class}組` : '-';
                const num = v.studentInfo ? `${v.studentInfo.number}番` : '-';
                const flagName = v.flagName;

                csvContent += `"${dateStr}","${typeStr}","${grade}","${cls}","${num}","${flagName}"\n`;
            });

            downloadCSVFile(csvContent, `学級旗コンテスト_投票明細ログ_${formatDateForFile()}.csv`);
        }

        function downloadCSVFile(content, fileName) {
            const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', fileName);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function formatDateForFile() {
            const d = new Date();
            return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}_${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}`;
        }

        function resetAllVotes() {
            if (confirm("【警告】すべての投票データと重複投票ログを消去します。\nこの操作は取り消せません。本当に行いますか？")) {
                localStorage.removeItem(STORAGE_VOTES);
                localStorage.removeItem(STORAGE_VOTED_STUDENTS);
                alert("全投票データを削除しました。");
                renderAdminResults();
            }
        }
    </script>
</body>
</html>
